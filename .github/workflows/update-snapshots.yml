name: Update snapshots

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  update-snapshots:
    name: Update snapshots and formatting
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/update-snapshots') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get PR HEAD
        if: github.event_name == 'issue_comment'
        id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Refusing to run on a pull request from a fork.');
              return;
            }

            core.setOutput('ref', pr.head.ref);

            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'issue_comment' && steps.pr.outputs.ref || github.ref }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/package.json
          cache: "pnpm"
          cache-dependency-path: app

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Format with Prettier
        run: pnpm exec prettier -w .
        working-directory: app

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium-headless-shell
        working-directory: app

      - name: Update Playwright snapshots
        run: pnpm exec playwright test -u
        working-directory: app
        continue-on-error: true

      - name: Update Vitest snapshots
        run: pnpm exec vitest run -u
        working-directory: app
        continue-on-error: true

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update snapshots and formatting"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment result
        if: github.event_name == 'issue_comment' && !cancelled()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const changed = '${{ steps.commit.outputs.changed }}' === 'true';
            const body = changed
              ? '✅ Pushed updated snapshots/formatting to this branch.'
              : 'ℹ️ Ran snapshot update and formatting, but nothing changed.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
