name: fastlane

on:
  push:
    tags:
      - "*"
    branches:
      - "renovate/**" # run checks on renovate branches to allow automerge without a PR
  workflow_dispatch:
    inputs:
      track:
        description: "The track to deploy to"
        type: choice
        options:
          - beta
          - production
        required: true
        default: beta
  pull_request:
    branches:
      - main
    paths:
      - "android-app/**"
      - "fastlane/**"
      - ".github/workflows/fastlane.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "zulu"
          java-version: 17
          cache: "gradle"

      - name: Setup Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: "4.0.10"
          bundler-cache: true
          working-directory: fastlane

      - name: Generate gplay-key.json file
        if: (github.event_name == 'push' && github.ref_type == 'tag') || github.event_name == 'workflow_dispatch'
        run: echo "${{secrets.GPLAY_PRIVATE_SERVICE_ACCOUNT_KEY}}" | base64 -d > fastlane/gplay-key.json

      - name: Generate .jks file
        if: (github.event_name == 'push' && github.ref_type == 'tag') || github.event_name == 'workflow_dispatch'
        run: echo "${{secrets.ANDROID_SIGNING_KEY}}"| base64 -d > fastlane/android-keys.jks

      - name: Build and submit to Google Play
        if: (github.event_name == 'push' && github.ref_type == 'tag') || github.event_name == 'workflow_dispatch'
        run: bundle exec fastlane ${{ inputs.track || 'beta' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{secrets.ANDROID_KEYSTORE_PASSWORD}}
          ANDROID_KEY_PASSWORD: ${{secrets.ANDROID_KEY_PASSWORD}}
        working-directory: fastlane

      - name: Build bundle
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
        run: bundle exec fastlane build
        working-directory: fastlane
