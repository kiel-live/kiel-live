name: App

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  pull-requests: write # allow surge-preview to create/update PR comments

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: app/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/package.json
          cache: "pnpm"
          cache-dependency-path: app

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Build 🔧
        run: pnpm build
        working-directory: ./app
        env:
          VITE_NATS_URL: ${{ secrets.BACKEND_URL }}
          # VITE_TILE_SERVER_URL: ${{ secrets.TILE_SERVER_URL }} # TODO

      - name: Copy service-worker for migration # TODO: remove after some time (added 26.05.2022)
        run: |
          cp sw.js service-worker.js
          cp sw.js.map service-worker.js.map
        working-directory: ./app/dist

      - uses: afc163/surge-preview@bf90a5a86111f6311ca42f0a5a0f80fb0fb03cec # v1.13.0
        if: "github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork"
        with:
          surge_token: ${{ secrets.SURGE_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          teardown: "true"
          dist: app/dist
          build: echo "dummy"

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        if: "github.ref_type == 'tag'"
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          repository-name: kiel-live/kiel-live.github.io
          branch: master
          folder: app/dist
          clean: true
