services:
  server:
    image: nats:2.14.2-scratch
    ports:
      - 127.0.0.1:4222:4222
      - 127.0.0.1:4223:4223
      - 127.0.0.1:8222:8222
    environment:
      - NATS_TOKEN_ADMIN=${ADMIN_TOKEN}
      - NATS_TOKEN_MANAGER=${MANAGER_TOKEN}
      - NATS_TOKEN_COLLECTOR=${COLLECTOR_TOKEN}
    volumes:
      - ./nats/nats-server.conf:/nats-server.conf
    command: -c /nats-server.conf
  setup:
    image: natsio/nats-box:0.19.7
    environment:
      - NATS_URL=server:4222
      - NATS_USER=admin
      - NATS_PASSWORD=${ADMIN_TOKEN}
    volumes:
      - ./nats/setup.sh:/setup.sh
      - ./nats/stream.json:/stream.json
    command: /setup.sh
    depends_on:
      - server
  # Optional hub service — enable by setting COLLECTOR_TOKEN in your .env.
  # Collectors point at the hub by setting COLLECTOR_CLIENT=hub and COLLECTOR_SERVER=ws://hub:8080.
  hub:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.25 AS build
        WORKDIR /src
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        RUN CGO_ENABLED=0 go build -o /hub ./hub
        FROM scratch
        COPY --from=build /hub /hub
        ENTRYPOINT ["/hub"]
    ports:
      - 127.0.0.1:8090:8080
    environment:
      - COLLECTOR_TOKEN=${COLLECTOR_TOKEN}
      - HUB_LISTEN=:8080
    profiles:
      - hub
