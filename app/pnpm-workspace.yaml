allowBuilds:
  esbuild: true

minimumReleaseAge: 1440 # 1 day

strictPeerDependencies: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - rollup@2.80.0

trustPolicyIgnoreAfter: 262980 # 6 months
minimumReleaseAgeExclude:
  # Renovate security update: vite@7.3.5
  - vite@7.3.5
  # Renovate security update: maplibre-gl@6.4.1
  - maplibre-gl@6.4.1
